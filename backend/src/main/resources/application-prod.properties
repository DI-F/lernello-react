# Activate with: SPRING_PROFILES_ACTIVE=prod
# DB from environment
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# TODO add Flyway (DB migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# CORS (Prod domains)
cors.allowed-origins=https://app.lernello.ch,https://lernello.ch
# Secure cookies in prod (HTTPS!)
app.auth.cookie-secure=true
app.auth.cookie-samesite=None
# Mail (from environment)
spring.mail.host=mail.infomaniak.ch
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# JWT secret (from environment)
jwt.secret=${JWT_SECRET}
