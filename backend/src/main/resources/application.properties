# --- Core (yours) ---
#TODO: Remove in future and in IDE for other profiles
spring.profiles.active=local
spring.application.name=lernello
# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# File storage
storage.path=./data/files
# --- JWT ---
# Secret used by JwtUtil to sign tokens (must be long & random!)
jwt.secret=change-me-to-a-very-long-random-256bit-secret-string
jwt.expiration=604800000
# --- CORS (Vite dev origin) ---
cors.allowed-origins=http://localhost:5173
# --- Passwordless auth knobs ---
# Cookie that carries the JWT
app.auth.cookie-name=lernello_auth_token
# In production set this to true (requires HTTPS)
app.auth.cookie-secure=false
# Lax for same-site dev. Use None when crossing sites/subdomains.
app.auth.cookie-samesite=Lax
# Short session when remember=false (minutes)
app.auth.short-ttl-minutes=60
# Long session when remember=true (days)
app.auth.long-ttl-days=30
# OTP validity window (minutes)
app.auth.code-ttl-minutes=10
# Optional: cooldown for resending OTP (seconds)
app.auth.resend-cooldown-seconds=30
