spring.application.name=lernello
# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# Storage
storage.path=./data/files
# JWT
jwt.secret=17u3uVLBiq1unAPMyDmIJJdYP1FG/7cCY+SFOIC80xw=<ChangeMe>
jwt.expiration=604800000
# Passwordless auth defaults
app.auth.cookie-name=lernello_auth_token
app.auth.cookie-samesite=Lax
app.auth.short-ttl-minutes=60m
app.auth.long-ttl-days=30d
app.auth.code-ttl-minutes=10m
app.auth.resend-cooldown-seconds=30s
# JPA defaults
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
