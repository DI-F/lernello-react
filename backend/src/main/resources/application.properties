spring.application.name=lernello
# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# Storage
storage.path=./data/files
# JWT
jwt.secret=17u3uVLBiq1unAPMyDmIJJdYP1FG/7cCY+SFOIC80xw=<ChangeMe>
# Auth Cookies
app.auth.access-cookie-name=lernello_access
app.auth.refresh-cookie-name=lernello_refresh
app.auth.cookie-secure=false           # Prod should be true
app.auth.cookie-samesite=Lax
# TTLs
app.auth.access-ttl=15m                # Access-Token short-lived
app.auth.refresh-long-ttl=30d          # Remember=true
app.auth.refresh-short-ttl=1d          # Remember=false
# OTP
app.auth.code-ttl-minutes=10m
app.auth.resend-cooldown-seconds=30s
# JPA defaults
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
