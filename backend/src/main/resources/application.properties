spring.application.name=lernello
# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# Storage
storage.path=./data/files
# JWT
jwt.secret=${JWT_SECRET:dev-only-not-for-prod-change-me}
jwt.expiration=604800000
# Passwordless auth defaults
app.auth.cookie-name=lernello_auth_token
app.auth.cookie-samesite=Lax
app.auth.short-ttl-minutes=60
app.auth.long-ttl-days=30
app.auth.code-ttl-minutes=10
app.auth.resend-cooldown-seconds=30
# JPA defaults
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
